# ordpf 管理端 Nginx
# 静态前端：frontend/admin
# /api/    -> Gateway /admin/   （员工端接口）
# /client/ -> Gateway 根路径     （小程序用户端接口）
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    access_log logs/access.log;
    error_log  logs/error.log warn;

    server {
        listen       8090;
        server_name  localhost;

        # 相对 Nginx prefix：middleware/nginx -> 项目根/frontend/admin
        root   ../../frontend/admin;
        index  index.html;

        # 管理端 SPA
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # 员工端 API：/api/employee/login -> gateway /admin/employee/login
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8080/admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # 小程序 API：/client/user/dish/list -> gateway /user/dish/list
        location ^~ /client/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # Knife4j 聚合页（可选，方便从同一个 Nginx 入口打开）
        location = /docs { return 302 /docs/doc.html; }

        location = /docs/ { return 302 /docs/doc.html; }

        location ^~ /docs/ {
            proxy_pass http://127.0.0.1:8092/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Sentinel Dashboard（可选）
        location ^~ /sentinel/ {
            proxy_pass http://127.0.0.1:8088/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root ../../frontend/admin;
            internal;
        }

        location = /health {
            default_type text/plain;
            return 200 "ordpf-admin-ok";
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}


