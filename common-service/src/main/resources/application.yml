server:
  port: 8089

spring:
  application:
    name: common-serivce # 服务名称（必须和网关里 lb://ctgy-serivce 一致）

  profiles:
    active: dev

  # 从 Nacos 配置中心引入共享配置（Spring Cloud 2021+ 官方写法，取代 bootstrap.yaml）
  config:
    import:
      - optional:nacos:shared-jdbc.yaml
      - optional:nacos:shared-redis.yaml
      - optional:nacos:shared-log.yaml
      - optional:nacos:shared-swagger.yaml

  cloud:
    nacos:
      server-addr: 127.0.0.1:8848 # 注册中心 + 配置中心地址
      username: nacos
      password: nacos

  main:
    allow-circular-references: true

  # 文件上传大小限制
  servlet:
    multipart:
      #最大单个文件大小
      max-file-size: 10MB
      #最大请求大小(包括所有文件和表单数据)
      max-request-size: 100MB


# 本服务只做文件上传，没有实体类，不需要 mybatis-plus 的 type-aliases-package
mybatis-plus:
  global-config:
    db-config:
      id-type: auto # 全局id类型为自增长
  mapper-locations: "classpath*:/mapper/**/*.xml"

# 阿里云 OSS
mzlhsc:
  aliyun:
    endpoint: https://oss-cn-shenzhen.aliyuncs.com
    bucket-name: tlias-ai-lc
    region: cn-shenzhen
    # AccessKey 默认从环境变量读取；也可以直接在这里填（不要把真实密钥提交到 git）
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
