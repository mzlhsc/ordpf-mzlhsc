server:
  port: 8080

spring:
  application:
    name: ordpf-gateway

  cloud:
    # 注册中心
    nacos:
      server-addr: 127.0.0.1:8848 # nacos地址

    gateway:
      server:
        webflux:
          # 关闭按服务名自动生成路由，全部手动显式配置
          discovery:
            locator:
              enabled: false
          routes:
            # 员工服务
            - id: emp-service
              uri: lb://emp-service
              predicates:
                - Path=/admin/employee/**

            # 分类服务（注意服务名就是 ctgy-serivce）
            - id: ctgy-service
              uri: lb://ctgy-serivce
              predicates:
                - Path=/admin/category/**,/user/category/**

            # 菜品服务
            - id: dish-service
              uri: lb://dish-service
              predicates:
                - Path=/admin/dish/**,/user/dish/**

            # 套餐服务
            - id: setmeal-service
              uri: lb://setmeal-service
              predicates:
                - Path=/admin/setmeal/**,/user/setmeal/**

            # 订单服务（订单 + 购物车）
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/admin/order/**,/user/order/**,/shopping-cart/**

            # 用户服务（用户登录 + 地址簿）
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/user/user/**,/addressBook/**

            # 报表与工作台
            - id: report-service
              uri: lb://report-service
              predicates:
                - Path=/admin/report/**,/admin/workspace/**

            # 店铺营业状态
            - id: shop-service
              uri: lb://shop-service
              predicates:
                - Path=/admin/shop/**,/user/shop/**

            # 通用服务（文件上传，注意服务名是 common-serivce）
            - id: common-service
              uri: lb://common-serivce
              predicates:
                - Path=/admin/common/**
          default-filters:
            - PrintAny

logging:
  level:
    org.springframework.cloud.gateway: info
    com.mzlhsc.gateway: debug

mzlhsc:
  #  拦截地址
  auth:
    exclude-paths: # 无需登录校验的路径（两个端都放行）
      - /admin/employee/login
      - /user/user/login
      - /user/user/register
      # 小程序浏览类接口，游客也要能看
      - /user/shop/status
      - /user/category/list
      - /user/dish/list
      - /user/setmeal/list
      - /user/setmeal/dish/**

    admin-include-paths: # 只允许「员工令牌」(请求头 zmlhsc) 访问
      - /admin/**

    user-include-paths: # 只允许「用户令牌」(请求头 authorization) 访问
      - /user/**
      - /addressBook/**
      - /shopping-cart/**
